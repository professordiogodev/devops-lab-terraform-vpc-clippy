<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="319" viewBox="0 0 1000 319" role="img" aria-label="Terraform: Clippy Staging, Rebuilt from Zero">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f3f46"/><stop offset="1" stop-color="#0f766e"/></linearGradient><radialGradient id="glow" cx=".85" cy=".5" r=".6"><stop offset="0" stop-color="#f9a8d4" stop-opacity=".28"/><stop offset="1" stop-color="#f9a8d4" stop-opacity="0"/></radialGradient></defs>
<rect width="1000" height="319" rx="18" fill="url(#bg)"/><rect width="1000" height="319" rx="18" fill="url(#glow)"/>
<circle cx="60" cy="40" r="3" fill="#f9a8d4" opacity=".7"><animate attributeName="opacity" values=".2;.9;.2" dur="3s" repeatCount="indefinite"/></circle>
<text x="48" y="64" font-size="14" letter-spacing="3" fill="#f9a8d4" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-weight="700">DEVOPS BOOTCAMP · LAB</text>
<text x="48" y="112" font-size="36" font-weight="800" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Terraform: Clippy Staging,</text>
<text x="48" y="155" font-size="36" font-weight="800" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Rebuilt from Zero</text>
<text x="48" y="185" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">Staging was built by clicking and nobody can rebuild it. Write the</text>
<text x="48" y="207" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">network and the server in Terraform, deploy Clippy on it, then destroy</text>
<text x="48" y="229" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">it all and bring it back with one command to prove it is reproducible.</text>
<rect x="48" y="261" width="114" height="32" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#f9a8d4" stroke-opacity=".7"/><text x="62" y="282" font-size="14" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">90-105 min</text>
<rect x="174" y="261" width="268" height="32" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#f9a8d4" stroke-opacity=".7"/><text x="188" y="282" font-size="14" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Cost: free tier, a few cents</text>
<g transform="translate(750,59)">
<path d="M30 150 L80 80 L140 110 L190 40" fill="none" stroke="#f9a8d4" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round"/>
<circle cx="30" cy="150" r="9" fill="#1e293b" stroke="#f9a8d4" stroke-width="3"/>
<circle cx="80" cy="80" r="9" fill="#1e293b" stroke="#f9a8d4" stroke-width="3"/>
<circle cx="140" cy="110" r="9" fill="#1e293b" stroke="#f9a8d4" stroke-width="3"/>
<circle cx="190" cy="40" r="9" fill="#1e293b" stroke="#f9a8d4" stroke-width="3"/>
<circle r="7" fill="#f9a8d4"><animateMotion dur="5s" repeatCount="indefinite" path="M30 150 L80 80 L140 110 L190 40"/></circle>
<circle cx="190" cy="40" r="9" fill="none" stroke="#f9a8d4"><animate attributeName="r" values="9;22;9" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/></circle>
</g>
</svg>
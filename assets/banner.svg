<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="319" viewBox="0 0 1000 319" role="img" aria-label="Terraform: Clippy Staging, Rebuilt from Zero">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c4a6e"/><stop offset="1" stop-color="#0e7490"/></linearGradient><radialGradient id="glow" cx=".85" cy=".5" r=".6"><stop offset="0" stop-color="#fef08a" stop-opacity=".28"/><stop offset="1" stop-color="#fef08a" stop-opacity="0"/></radialGradient></defs>
<rect width="1000" height="319" rx="18" fill="url(#bg)"/><rect width="1000" height="319" rx="18" fill="url(#glow)"/>
<circle cx="60" cy="40" r="3" fill="#fef08a" opacity=".7"><animate attributeName="opacity" values=".2;.9;.2" dur="3s" repeatCount="indefinite"/></circle>
<text x="48" y="64" font-size="14" letter-spacing="3" fill="#fef08a" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-weight="700">DEVOPS BOOTCAMP · LAB</text>
<text x="48" y="112" font-size="36" font-weight="800" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Terraform: Clippy Staging,</text>
<text x="48" y="155" font-size="36" font-weight="800" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Rebuilt from Zero</text>
<text x="48" y="185" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">Staging was built by clicking and nobody can rebuild it. Write the</text>
<text x="48" y="207" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">network and the server in Terraform, deploy Clippy on it, then destroy</text>
<text x="48" y="229" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">it all and bring it back with one command to prove it is reproducible.</text>
<rect x="48" y="261" width="114" height="32" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#fef08a" stroke-opacity=".7"/><text x="62" y="282" font-size="14" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">90-105 min</text>
<rect x="174" y="261" width="268" height="32" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#fef08a" stroke-opacity=".7"/><text x="188" y="282" font-size="14" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Cost: free tier, a few cents</text>
<g transform="translate(750,59)">
<g><path d="M60 130 a34 34 0 0 1 8 -66 a46 46 0 0 1 88 8 a30 30 0 0 1 -6 58 Z" fill="#e0f2fe"/><animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="4s" repeatCount="indefinite"/></g>
